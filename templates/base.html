<!DOCTYPE html>
<html lang="en" data-theme="corporate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager HQ</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .active { pointer-events: none; }
    </style>
</head>
<body class="min-h-screen bg-base-200">

    <div class="drawer lg:drawer-open">
        <input id="main-drawer" type="checkbox" class="drawer-toggle" />

        <div class="drawer-content flex flex-col p-4 lg:p-10">

            <div class="flex justify-between items-center lg:hidden mb-6 bg-base-100 p-4 rounded-xl shadow-sm border border-base-300">
                <label for="main-drawer" class="btn btn-ghost btn-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-5 h-5 stroke-current">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </label>
                <span class="font-black italic uppercase text-sm tracking-tighter text-primary">TM HQ</span>
            </div>

            <main class="max-w-7xl mx-auto w-full">
                {% block content %}{% endblock %}
            </main>
        </div>

        {% include "includes/sidebar.html" %}
    </div>

</body>
</html>
