<!DOCTYPE html>
<html lang="en" data-theme="corporate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200">

    <div class="drawer lg:drawer-open">
        <input id="main-drawer" type="checkbox" class="drawer-toggle" />

        <div class="drawer-content flex flex-col p-6 lg:p-10">
            <label for="main-drawer" class="btn btn-primary drawer-button lg:hidden mb-4 w-fit">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-5 h-5 stroke-current">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
                Menu
            </label>

            <main class="max-w-6xl">
                {% block content %}
                {% endblock %}
            </main>
        </div>

        <div class="drawer-side shadow-2xl">
            <label for="main-drawer" class="drawer-overlay"></label>
            <ul class="menu p-4 w-80 min-h-full bg-base-100 text-base-content font-medium gap-1">
                <li class="mb-10 text-3xl font-black text-primary px-4 tracking-tighter italic">
                    IT-MANAGER
                </li>

                {% with url_name=request.resolver_match.url_name %}
                <li>
                    <a href="{% url 'manager:index' %}"
                       class="{% if url_name == 'index' %}active{% endif %}">
                        🏠 Dashboard
                    </a>
                </li>

                <li>
                    <a href="{% url 'manager:project-list' %}"
                       class="{% if request.resolver_match.url_name == 'project-list' %}active{% endif %}">
                       📂 Projects
                    </a>
                </li>

                <li>
                    <a href="{% url 'manager:task-list' %}"
                       class="{% if url_name == 'task-list' %}active{% endif %}">
                        📋 Tasks
                    </a>
                </li>

                <li>
                    <a href="{% url 'manager:worker-list' %}"
                       class="{% if request.resolver_match.url_name == 'worker-list' %}active{% endif %}">
                       👥 Workers
                    </a>
                </li>
                {% endwith %}

                <div class="divider mt-auto text-xs opacity-50 uppercase tracking-widest">Admin Space</div>
                <li>
                    <a href="/admin/" target="_blank">
                        ⚙️ Django Admin
                    </a>
                </li>
            </ul>
        </div>
    </div>

</body>
</html>
