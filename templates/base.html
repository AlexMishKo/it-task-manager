<!DOCTYPE html>
<html lang="en" data-theme="corporate"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200">

    <div class="drawer lg:drawer-open">
        <input id="my-drawer-2" type="checkbox" class="drawer-toggle" />

        <div class="drawer-content flex flex-col items-center justify-start p-8">
            <label for="my-drawer-2" class="btn btn-primary drawer-button lg:hidden mb-4">Open menu</label>

            <main class="w-full max-w-5xl">
                {% block content %}
                {% endblock %}
            </main>
        </div>

        <div class="drawer-side shadow-xl">
            <label for="my-drawer-2" aria-label="close sidebar" class="drawer-overlay"></label>
            <ul class="menu p-4 w-80 min-h-full bg-base-100 text-base-content pt-10">
                <li class="mb-4 text-2xl font-bold px-4 text-primary">IT Manager</li>
                <li><a href="{% url 'manager:index' %}" class="active">🏠 Dashboard</a></li>
                <li><a href="#">📂 Projects</a></li>
                <li><a href="#">📋 Tasks</a></li>
                <li><a href="#">👥 Workers</a></li>
                <div class="divider">Settings</div>
                <li><a href="/admin/">⚙️ Admin Panel</a></li>
            </ul>
        </div>
    </div>

</body>
</html>
