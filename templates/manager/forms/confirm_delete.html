{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-20">
    <div class="card bg-base-100 shadow-2xl border-2 border-error/20">
        <div class="card-body items-center text-center">
            <div class="w-20 h-20 bg-error/10 text-error rounded-full flex items-center justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h2 class="card-title text-2xl font-black uppercase italic tracking-tighter">Confirm Destruction</h2>
            <p class="text-sm opacity-60 mb-6">
                Are you sure you want to delete <span class="font-bold text-error">"{{ object }}"</span>? This action cannot be intercepted once initiated.
            </p>
            <div class="card-actions w-full flex-col gap-2">
                <form method="post" class="w-full">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-error w-full font-black uppercase italic">Execute Delete</button>
                </form>
                <a href="javascript:history.back()" class="btn btn-ghost w-full font-black uppercase italic">Abort Mission</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
