{% extends "base.html" %}

{% block content %}
<div class="mb-6">
    <a href="javascript:history.back()" class="text-xs font-bold uppercase opacity-50 hover:opacity-100 transition-opacity">
        ← Abort Operation
    </a>
</div>

<div class="max-w-2xl mx-auto">
    <div class="bg-base-100 border border-base-300 rounded-xl overflow-hidden shadow-2xl">
        <div class="p-8 border-b border-base-200 bg-base-200/30">
            <h1 class="text-3xl font-black italic uppercase tracking-tighter text-primary leading-none">
                {% if object %}Modify Mission{% else %}New Deployment{% endif %}
            </h1>
            <p class="text-[10px] font-black opacity-40 uppercase tracking-[0.3em] mt-2">Intelligence Update Form</p>
        </div>

        <form method="post" class="p-8 space-y-6">
            {% csrf_token %}

            {% for field in form %}
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-black uppercase text-[10px] opacity-60 tracking-widest">{{ field.label }}</span>
                    </label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-error text-xs mt-1 font-bold italic">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="pt-6 flex gap-4">
                <button type="submit" class="btn btn-primary flex-1 font-black italic uppercase">
                    Confirm Data Transmission
                </button>
                <a href="javascript:history.back()" class="btn btn-ghost font-black italic uppercase">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
